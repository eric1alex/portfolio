<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="/src/js/theme-config.js"></script>
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Portfolio of Eric Alex - Work</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QMWDY8P9GQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QMWDY8P9GQ');
    </script>
</head>
<body class="font-body text-on-surface selection:bg-primary selection:text-on-primary">
    <nav class="fixed top-8 left-8 lg:top-12 lg:left-12 z-50">
        <a class="flex items-center gap-2 text-[#1a1c19] text-style-label transition-colors duration-200 hover:text-secondary" href="../index.html">
            <span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
            <span class="text-[0.625rem] uppercase tracking-widest">Back</span>
        </a>
    </nav>
    <main class="max-w-screen-xl mx-auto px-8 pt-16 pb-8 lg:py-12 min-h-[716px]">
        <!-- Opening Statement -->
        <div class="mb-6 lg:mb-12 max-w-2xl">
            <h1 class="text-3xl md:text-5xl text-style-title tracking-tight leading-[1.1] mb-4 text-primary">
                work record
            </h1>
            <p class="text-xs md:text-sm text-style-body text-secondary opacity-60 leading-relaxed tracking-tight">
                A chronological archive of professional engagements and industrial contributions within the digital design sector.
            </p>
        </div>
        <!-- Experience List -->
        <section id="work-list-container" class="space-y-0">
            <!-- Content will be injected here -->
        </section>

        <script>
            async function loadWork() {
                const container = document.getElementById('work-list-container');
                try {
                    const response = await fetch('/data/content.json');
                    const data = await response.json();
                    
                    if (data.work && data.work.length > 0) {
                        const html = data.work.map((item, index) => {
                            const paddedIndex = (index + 1).toString().padStart(2, '0');
                            return `
                                <a href="detail.html?id=${item.id}" class="block group border-t border-outline-variant/30 py-3 lg:py-5 flex flex-col md:flex-row md:items-baseline md:justify-between transition-colors duration-200 hover:bg-surface-container-low/30">
                                    <div class="flex flex-col space-y-1">
                                        <span class="text-[0.6rem] uppercase tracking-widest text-outline opacity-40">${paddedIndex}</span>
                                        <h2 class="text-lg md:text-xl text-style-title tracking-tight text-primary lowercase">${item.title}</h2>
                                        <span class="text-[0.6rem] uppercase tracking-widest text-secondary opacity-60">${item.company}</span>
                                    </div>
                                    <div class="mt-2 md:mt-0">
                                        <span class="text-xs md:text-sm tabular-nums text-on-surface opacity-60">${item.year}</span>
                                    </div>
                                </a>
                            `;
                        }).join('');
                        
                        container.innerHTML = html + '<div class="border-t border-outline-variant/30"></div>';
                    } else {
                        container.innerHTML = '<p class="py-8 text-secondary opacity-40">No work records found.</p>';
                    }
                } catch (error) {
                    console.error('Error loading work records:', error);
                    container.innerHTML = '<p class="py-8 text-error">Error loading work records.</p>';
                }
            }
            
            loadWork();
        </script>
        <!-- Technical Metadata -->
        <div class="mt-8 lg:mt-16 max-w-md">
            <p class="text-style-label text-outline leading-relaxed tracking-widest opacity-40">
                Documentation of professional trajectory. Each entry represents a commitment to functional purity and structural integrity.
            </p>
        </div>
    </main>
    <!-- Sticky/Fixed Elements using Size Variant 1 -->
    <footer class="fixed bottom-12 right-12 pointer-events-none opacity-20 hidden lg:block">
        <div class="text-[0.625rem] font-medium tracking-[0.3em] uppercase rotate-90 origin-right">

        </div>
    </footer>
</body>
</html>
