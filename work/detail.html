<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#3b3b3b",
                        "tertiary-fixed-dim": "#474747",
                        "surface-dim": "#dadad5",
                        "on-error-container": "#410002",
                        "on-background": "#1a1c19",
                        "primary-fixed": "#5e5e5e",
                        "surface-variant": "#e3e3de",
                        "on-tertiary-fixed-variant": "#e2e2e2",
                        "on-tertiary-fixed": "#ffffff",
                        "primary": "#000000",
                        "background": "#fafaf5",
                        "surface-tint": "#5e5e5e",
                        "tertiary-container": "#747474",
                        "on-tertiary-container": "#ffffff",
                        "surface-bright": "#fafaf5",
                        "on-tertiary": "#e2e2e2",
                        "inverse-surface": "#2f312e",
                        "surface-container-high": "#e8e8e3",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "on-surface": "#1a1c19",
                        "primary-container": "#3b3b3b",
                        "on-secondary-fixed": "#1b1b1b",
                        "tertiary-fixed": "#5e5e5e",
                        "surface-container": "#eeeee9",
                        "secondary-container": "#d4d4d4",
                        "on-secondary": "#ffffff",
                        "tertiary": "#3b3b3b",
                        "surface": "#fafaf5",
                        "outline": "#777777",
                        "inverse-primary": "#c6c6c6",
                        "on-primary-container": "#ffffff",
                        "primary-fixed-dim": "#474747",
                        "secondary": "#5e5e5e",
                        "on-primary": "#e2e2e2",
                        "on-surface-variant": "#474747",
                        "surface-container-highest": "#e3e3de",
                        "outline-variant": "#c6c6c6",
                        "secondary-fixed-dim": "#ababab",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f1f1ec",
                        "on-primary-fixed": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#1b1b1b",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#c6c6c6",
                        "surface-container-low": "#f4f4ef",
                        "on-error": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Space Grotesk", "sans-serif"],
                        "label": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px" },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Sticky Top Bar */
        #sticky-header {
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sticky-header.visible {
            transform: translateY(0);
        }

        /* Focus Mode Styles */
        #record-container.is-focusing>section,
        #record-container.is-focusing>div.image-block {
            opacity: 0.1 !important;
            filter: grayscale(1) blur(4px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #record-container.is-focusing>.focused-card {
            opacity: 1 !important;
            filter: none !important;
            transform: translateY(-8px) scale(1.01);
        }

        #reset-view-btn {
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        #reset-view-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Floating Index Dropdown Logic */
        #index-dropdown {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #index-dropdown.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        #floating-index-btn.is-hidden {
            transform: translate(-50%, 150%);
            opacity: 0;
        }
    </style>
</head>

<body class="font-body selection:bg-primary selection:text-on-primary min-h-screen bg-[#f8f8f6]">
    <div id="loading-overlay" class="fixed inset-0 bg-surface z-[110] flex items-center justify-center">
        <p class="text-[0.6rem] uppercase tracking-[0.3em] animate-pulse">Initializing Record...</p>
    </div>

    <!-- Sticky Header (Desktop) -->
    <nav id="sticky-header"
        class="hidden md:flex fixed top-0 left-0 right-0 bg-surface/80 backdrop-blur-md border-b border-outline-variant/10 z-[90] h-16 items-center px-12 justify-between shadow-sm">
        <div class="max-w-[1200px] mx-auto w-full flex justify-between items-center">
            <div class="flex items-center gap-6">
                <a href="./" class="text-on-surface hover:text-primary transition-colors flex items-center">
                    <span class="material-symbols-outlined text-xl">arrow_back</span>
                </a>
                <div class="h-4 w-px bg-outline-variant/20"></div>
                <span class="text-[0.7rem] uppercase tracking-widest font-bold text-on-surface truncate"
                    id="sticky-title-display">---</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[0.55rem] uppercase tracking-[0.2em] text-outline font-bold">Archive Record</span>
                <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            </div>
        </div>
    </nav>

    <!-- Floating Index Dropdown (Pill Style) -->
    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center">
        <!-- The Menu -->
        <div id="index-dropdown"
            class="mb-3 bg-surface-container-lowest backdrop-blur-2xl border border-outline-variant/20 rounded-2xl p-1.5 shadow-2xl min-w-[160px]">
            <div class="text-[0.4rem] uppercase tracking-[0.3em] font-bold text-outline px-3 py-1.5 opacity-40">Index
            </div>
            <nav id="dropdown-links" class="flex flex-col gap-0.5">
                <!-- Populated via JS -->
            </nav>
        </div>

        <!-- The Toggle Button -->
        <button id="floating-index-btn" onclick="toggleIndex()"
            class="bg-surface-container-lowest text-on-surface border border-outline-variant/30 px-4 py-2 rounded-full shadow-lg hover:bg-surface-container-low transition-all duration-300 flex items-center gap-2 group">
            <span class="text-[0.55rem] uppercase tracking-[0.25em] font-bold opacity-70">Index</span>
            <span class="material-symbols-outlined text-sm opacity-30 transition-transform group-hover:rotate-180"
                id="index-arrow">keyboard_arrow_up</span>
        </button>
    </div>

    <!-- Main Content Area (Centered) -->
    <main class="flex flex-col items-center p-4 md:p-8 lg:p-12 pb-40">
        <!-- Reset View btn -->
        <button id="reset-view-btn" onclick="resetFocus()"
            class="fixed top-8 left-8 z-[100] bg-surface border border-outline-variant/20 w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:bg-primary hover:text-surface transition-all group">
            <span
                class="material-symbols-outlined text-xl group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
        </button>

        <div class="w-full max-w-[1100px]">
            <!-- Header -->
            <header
                class="mb-12 bg-surface p-6 md:p-12 rounded-[2.5rem] border border-outline-variant/10 shadow-sm relative overflow-hidden group">
                <div
                    class="absolute top-0 left-0 w-1.5 h-full bg-primary opacity-0 group-hover:opacity-100 transition-opacity">
                </div>

                <div class="flex items-center gap-3 mb-10">
                    <span
                        class="text-[0.6rem] uppercase tracking-[0.3em] font-bold text-surface bg-on-surface px-2 py-0.5"
                        id="record-type">RECORD</span>
                    <span class="text-[0.6rem] uppercase tracking-[0.3em] font-bold text-outline" id="plate-no">PLATE
                        NO. —</span>
                </div>

                <h1 class="text-3xl md:text-5xl lg:text-6xl font-bold tracking-tighter text-on-surface leading-[1.1] mb-12"
                    id="project-title">
                    —
                </h1>

                <!-- Horizontal Metadata Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-8" id="metadata-grid">
                    <!-- Data injected here -->
                </div>
            </header>

            <!-- Record Narrative -->
            <div class="flex flex-col gap-12" id="record-container">
                <!-- Data injected here -->
            </div>
        </div>
    </main>

    <script>
        let isIndexOpen = false;

        async function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { window.location.href = './'; return; }

            try {
                const response = await fetch('../data/content.json?t=' + Date.now());
                const data = await response.json();

                const item = data.work.find(i => i.id === id) ||
                    data.sideProjects.find(i => i.id === id) ||
                    data.interests.find(i => i.id === id);
                if (!item) return;

                const det = item.details || {};
                document.title = `${item.title} // Portfolio`;
                document.getElementById('project-title').textContent = item.title;
                document.getElementById('sticky-title-display').textContent = det.stickyTitle || item.title;
                document.getElementById('plate-no').textContent = `PLATE NO. ${det.plateNo || (item.id.substring(0, 6))}`;
                document.getElementById('record-type').textContent = det.type || 'WORK RECORD';

                // Metadata Row
                const metaGrid = document.getElementById('metadata-grid');
                const meta = det.metadata || [
                    { label: 'Category', value: item.category },
                    { label: 'Year', value: item.year }
                ];
                metaGrid.innerHTML = meta.map(m => `
                    <div class="flex flex-col gap-2">
                        <span class="text-[0.55rem] md:text-[0.65rem] uppercase tracking-[0.2em] text-outline font-bold">${m.label}</span>
                        <span class="text-[0.75rem] md:text-[0.85rem] font-bold uppercase tracking-widest text-on-surface leading-tight">${m.value}</span>
                    </div>
                `).join('');

                const allSections = det.sections || [];

                // Dropdown links (Filter out images)
                const textSections = allSections.filter(s => s.type !== 'image' && !s.imageUrl);
                document.getElementById('dropdown-links').innerHTML = textSections.map((s, idx) => `
                    <button onclick="focusSection('${s.id}')" class="flex items-center gap-2.5 text-[0.6rem] uppercase tracking-[0.05em] font-bold text-on-surface/50 hover:text-primary hover:bg-primary/5 transition-all px-3 py-1.5 rounded-lg text-left">
                        <span class="text-[0.45rem] font-mono text-outline/30 w-3">${idx + 1}</span>
                        <span class="truncate">${s.label}</span>
                    </button>
                `).join('');

                let containerHtml = '';
                allSections.forEach((s, idx) => {
                    if (s.type === 'image' || s.imageUrl) {
                        containerHtml += `
                            <div id="${s.id}" class="image-block bg-surface p-4 rounded-3xl border border-outline-variant/10 shadow-sm transition-all duration-500">
                                <div class="aspect-video w-full overflow-hidden rounded-2xl">
                                    <img src="${s.imageUrl}" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" alt="${s.label}" />
                                </div>
                                <div class="mt-4 px-4 flex justify-between items-center opacity-30">
                                    <span class="text-[0.6rem] uppercase tracking-widest font-bold">${s.label}</span>
                                    <span class="text-[0.6rem] font-mono">ARCHIVE_P${idx + 1}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        let cardStyle = s.special ? "bg-[#f4f2ea] border-primary/20 shadow-md relative" : "bg-surface";
                        let contentHtml = marked.parse(s.content || '');

                        containerHtml += `
                            <section id="${s.id}" class="transition-all duration-500 group">
                                <div class="flex flex-col gap-3 mb-4 px-2">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[0.6rem] uppercase tracking-[0.3em] font-bold text-outline">${s.label}</span>
                                        <span class="text-[0.65rem] font-bold text-on-surface/20">0${idx + 1}</span>
                                    </div>
                                </div>
                                <div class="${cardStyle} rounded-[2rem] border border-outline-variant/10 shadow-sm p-8 md:p-10 lg:p-12 transition-all duration-500">
                                    ${s.special ? '<div class="absolute left-0 top-10 bottom-10 w-1.5 bg-primary rounded-r-full"></div>' : ''}
                                    <div class="text-on-surface/90 leading-relaxed text-sm md:text-[0.95rem] space-y-4">
                                        ${contentHtml}
                                    </div>
                                </div>
                            </section>
                        `;
                    }
                });

                document.getElementById('record-container').innerHTML = containerHtml;

                // Scroll Listener
                window.addEventListener('scroll', () => {
                    const sticky = document.getElementById('sticky-header');
                    const container = document.getElementById('record-container');

                    if (window.scrollY > 300 && !container.classList.contains('is-focusing')) {
                        sticky.classList.add('visible');
                    } else {
                        sticky.classList.remove('visible');
                    }
                });

                // Close dropdown on outside click
                document.addEventListener('click', (e) => {
                    const dropdown = document.getElementById('index-dropdown');
                    const btn = document.getElementById('floating-index-btn');
                    if (!dropdown.contains(e.target) && !btn.contains(e.target) && isIndexOpen) {
                        toggleIndex();
                    }
                });

                setTimeout(() => {
                    document.getElementById('loading-overlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
                }, 400);

            } catch (error) { console.error(error); }
        }

        function toggleIndex() {
            isIndexOpen = !isIndexOpen;
            const dropdown = document.getElementById('index-dropdown');
            const arrow = document.getElementById('index-arrow');
            if (isIndexOpen) {
                dropdown.classList.add('active');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                dropdown.classList.remove('active');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function focusSection(id) {
            const container = document.getElementById('record-container');
            const target = document.getElementById(id);
            const btn = document.getElementById('reset-view-btn');
            const sticky = document.getElementById('sticky-header');
            const floatingBtn = document.getElementById('floating-index-btn');
            const dropdown = document.getElementById('index-dropdown');

            if (isIndexOpen) toggleIndex();

            container.querySelectorAll('section, div.image-block').forEach(el => el.classList.remove('focused-card'));

            container.classList.add('is-focusing');
            target.classList.add('focused-card');
            btn.classList.add('visible');
            sticky.classList.remove('visible');
            floatingBtn.classList.add('is-hidden');
            document.body.style.overflow = 'hidden';

            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetFocus() {
            const container = document.getElementById('record-container');
            const btn = document.getElementById('reset-view-btn');
            const sticky = document.getElementById('sticky-header');
            const floatingBtn = document.getElementById('floating-index-btn');

            container.classList.remove('is-focusing');
            container.querySelectorAll('section, div.image-block').forEach(el => el.classList.remove('focused-card'));
            btn.classList.remove('visible');
            floatingBtn.classList.remove('is-hidden');
            document.body.style.overflow = '';

            if (window.scrollY > 300) sticky.classList.add('visible');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadDetail();
    </script>
</body>

</html>
