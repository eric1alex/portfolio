<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="/src/js/theme-config.js"></script>
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Portfolio of Eric Alex - Photography</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QMWDY8P9GQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QMWDY8P9GQ');
    </script>
</head>
<body class="font-body text-on-surface selection:bg-primary selection:text-on-primary">
    <nav class="fixed top-12 left-12 z-50">
        <a class="flex items-center gap-2 text-on-surface text-style-label transition-colors duration-200 hover:text-secondary" href="index.html">
            <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            <span>Back</span>
        </a>
    </nav>

    <main class="max-w-[1440px] mx-auto px-8 lg:px-16 py-32 lg:py-48">
        <!-- Hero Header -->
        <header class="mb-16 lg:mb-48 max-w-4xl">
            <span class="text-style-label text-outline opacity-40 mb-6 lg:mb-8 block">COLLECTION 01 / ARCHITECTURAL FRAGMENTS</span>
            <h1 class="text-5xl md:text-[6rem] lg:text-[8rem] font-bold tracking-tighter leading-[0.9] mb-12 text-primary uppercase">
                THE SILENCE<br/>OF FORM.
            </h1>
            <p class="text-xl lg:text-2xl text-secondary leading-relaxed max-w-2xl font-light">
                A study of shadow and structural economy. These plates document the interaction between brutalist concrete and the shifting geometry of natural light.
            </p>
        </header>

        <!-- Asymmetric Grid -->
        <div id="photography-grid-container" class="grid grid-cols-1 md:grid-cols-12 gap-y-16 md:gap-y-48 items-start">
            <!-- Content will be injected here -->
        </div>

        <script>
            async function loadPhotography() {
                const container = document.getElementById('photography-grid-container');
                try {
                    const response = await fetch('/data/content.json');
                    const data = await response.json();
                    
                    if (data.photography && data.photography.length > 0) {
                        container.innerHTML = data.photography.map((item, index) => {
                            const isLast = (index === data.photography.length - 1);
                            const finalClass = isLast ? 'mt-32' : '';
                            
                            return `
                                <div class="${item.colSpan} ${finalClass} group">
                                    <div class="aspect-[${item.aspect || '4/5'}] bg-surface-container overflow-hidden">
                                        <img src="${item.url}" 
                                             alt="${item.caption}" class="w-full h-full object-cover grayscale brightness-90 group-hover:scale-105 transition-transform duration-700"/>
                                    </div>
                                    <div class="mt-6 flex flex-col gap-1 opacity-40 group-hover:opacity-100 transition-opacity ${item.captionRight ? 'text-right' : ''}">
                                        <span class="text-[0.6rem] font-bold tracking-widest uppercase">PLATE NO. ${item.plateNo}</span>
                                        <span class="text-[0.6rem] font-medium tracking-widest uppercase">${item.caption}</span>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        container.innerHTML = '<p class="col-span-12 py-8 text-secondary opacity-40">No photo plates found.</p>';
                    }
                } catch (error) {
                    console.error('Error loading photography records:', error);
                    container.innerHTML = '<p class="col-span-12 py-8 text-error">Error loading photography records.</p>';
                }
            }
            
            loadPhotography();
        </script>

        </div>
    </main>

    <!-- Sticky/Fixed Elements using Size Variant 1 -->
    <footer class="fixed bottom-12 right-12 pointer-events-none opacity-20">
        <div class="text-[0.625rem] font-medium tracking-[0.3em] uppercase rotate-90 origin-right">

        </div>
    </footer>
</body>
</html>
