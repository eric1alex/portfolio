    <script>
        const bg = document.getElementById('hover-bg');

        // Preload hover images for instant response
        const imagesToPreload = [
            '/images/Image - 1.jpg',
            '/images/Image - 6.jpg',
            '/images/Image - 11.jpg'
        ];
        imagesToPreload.forEach(url => {
            const img = new Image();
            img.src = url;
        });

        let hoverTimeout;

        function setBg(url) {
            // Small delay to prevent cycling when moving mouse quickly across options
            clearTimeout(hoverTimeout);
            hoverTimeout = setTimeout(() => {
                bg.style.backgroundImage = `url('${url}')`;
                bg.classList.remove('opacity-0');
                bg.classList.add('opacity-10');
                bg.classList.remove('scale-105');
                bg.classList.add('scale-100');
            }, 50);
        }

        function clearBg() {
            clearTimeout(hoverTimeout);
            bg.classList.remove('opacity-10');
            bg.classList.add('opacity-0');
            bg.classList.remove('scale-100');
            bg.classList.add('scale-105');
        }
    </script>

    <!-- Sticky/Fixed Elements using Size Variant 1 -->
