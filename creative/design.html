<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="../src/js/theme-config.js"></script>
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>design // eric alex</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QMWDY8P9GQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-QMWDY8P9GQ');
    </script>
</head>

<body class="font-body text-on-surface selection:bg-primary selection:text-on-primary">
    <nav class="fixed top-8 left-8 lg:top-12 lg:left-12 z-50">
        <a class="flex items-center gap-2 text-on-surface text-style-label transition-all duration-300 hover:text-secondary bg-surface/60 backdrop-blur-md px-4 py-2 rounded-full border border-outline-variant/10 shadow-sm hover:shadow-md hover:-translate-y-0.5"
            href="./">
            <span class="material-symbols-outlined !text-[1.2rem]" data-icon="arrow_back">arrow_back</span>
            <span class="tracking-widest uppercase text-[0.65rem] font-bold">Back</span>
        </a>
    </nav>

    <main class="max-w-[1440px] mx-auto px-8 lg:px-16 py-32 lg:py-48">
        <!-- Hero Header -->
        <header class="mb-16 lg:mb-48 max-w-4xl">
            <span class="text-style-label text-outline opacity-40 mb-6 lg:mb-8 block">COLLECTION 02 / VISUAL
                SYSTEMS</span>
            <h1
                class="text-5xl md:text-[6rem] lg:text-[8rem] font-bold tracking-tighter leading-[0.9] mb-12 text-primary uppercase">

                DESIGN AS <br />DISCIPLINE.
            </h1>
            <p class="text-xl lg:text-2xl text-secondary leading-relaxed max-w-2xl font-light">
                A collection of graphic work focused on clarity and composition. Typography, layout, and visual
                hierarchy — applied with precision and purpose.
            </p>
        </header>

        <!-- Asymmetric Grid -->
        <div id="design-grid-container" class="grid grid-cols-1 md:grid-cols-12 gap-y-16 md:gap-y-48 items-start">
            <!-- Content will be injected here -->
        </div>

        <script>
            async function loadDesign() {
                const container = document.getElementById('design-grid-container');
                try {
                    const response = await fetch('../data/content.json?t=' + Date.now());
                    const data = await response.json();

                    if (data.design && data.design.length > 0) {
                        container.innerHTML = data.design.map((item, index) => {
                            // Simplified layout logic for design items
                            // item 1: md:col-span-5 md:col-start-2
                            // item 2: md:col-span-4 md:col-start-8 md:mt-48
                            // item 3: md:col-span-12

                            let layoutClass = '';
                            if (index % 3 === 0) {
                                layoutClass = 'md:col-span-5 md:col-start-2';
                            } else if (index % 3 === 1) {
                                layoutClass = 'md:col-span-4 md:col-start-8 md:mt-48';
                            } else {
                                layoutClass = 'md:col-span-6 md:col-start-4 md:mt-24';
                            }

                            const rawUrl = item.url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuB3GipTzBJRwmxfwnL2cZjxBUjCwWWAliNKi873jVCUXyIa95Mgyzzya0ma7z_XVUcTEgg37coggUYVz_6tzjPHKg9ehU3ZWzqaCBSZrnVbWjqwHyxwojLnLDsd-uEguCto-9FuZal9km_hYIm6OU6MF3LnC8d_6nJ2Ohd4aKdQtPmKwgb9jRicncHypKhTVfGS0-Od6ojyipioxsp2qt93e0Zo_AtSGOYEGJnW0dlr3Ik_NyTOcSdQBrMnq5Kgc_QTXdtTKf2-57Y';
                            const imgUrl = rawUrl.startsWith('http') ? rawUrl : (rawUrl.startsWith('/') ? '../public' + rawUrl : '../public/' + rawUrl);

                            return `
                                <div class="${layoutClass} group">
                                    <div class="bg-surface-container overflow-hidden">
                                        <img src="${imgUrl}" 
                                             alt="${item.title}" loading="lazy" class="w-full h-auto transition-all duration-700"/>
                                    </div>
                                    <div class="mt-6 flex flex-col gap-1 opacity-40 group-hover:opacity-100 transition-opacity">
                                        <span class="text-[0.6rem] font-bold tracking-widest uppercase">PLATE NO. D-${(index + 1).toString().padStart(3, '0')}</span>
                                        <span class="text-[0.6rem] font-medium tracking-widest uppercase">${item.title}</span>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        container.innerHTML = '<p class="col-span-12 py-8 text-secondary opacity-40">No design entries found.</p>';
                    }
                } catch (error) {
                    console.error('Error loading design records:', error);
                    container.innerHTML = '<p class="col-span-12 py-8 text-error">Error loading design records.</p>';
                }
            }

            loadDesign();
        </script>
    </main>

    <!-- Sticky/Fixed Elements using Size Variant 1 -->
    <footer class="fixed bottom-12 right-12 pointer-events-none opacity-20">
        <div class="text-[0.625rem] font-medium tracking-[0.3em] uppercase rotate-90 origin-right">

        </div>
    </footer>
</body>

</html>
