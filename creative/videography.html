<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="../src/js/theme-config.js"></script>
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>videography // eric alex</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QMWDY8P9GQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QMWDY8P9GQ');
    </script>
</head>
<body class="font-body text-on-surface selection:bg-primary selection:text-on-primary">
    <nav class="fixed top-8 left-8 lg:top-12 lg:left-12 z-50">
        <a class="flex items-center gap-2 text-on-surface text-style-label transition-all duration-300 hover:text-secondary bg-surface/60 backdrop-blur-md px-4 py-2 rounded-full border border-outline-variant/10 shadow-sm hover:shadow-md hover:-translate-y-0.5" href="index.html">
            <span class="material-symbols-outlined !text-[1.2rem]" data-icon="arrow_back">arrow_back</span>
            <span class="tracking-widest uppercase text-[0.65rem] font-bold">Back</span>
        </a>
    </nav>

    <main class="max-w-[1440px] mx-auto px-8 lg:px-16 py-32 lg:py-48">
        <!-- Hero Header -->
        <header class="mb-16 lg:mb-48 max-w-4xl">
            <span class="text-style-label text-outline opacity-40 mb-6 lg:mb-8 block">COLLECTION 03 / KINETIC ARCHIVES</span>
            <h1 class="text-5xl md:text-[6rem] lg:text-[8rem] font-bold tracking-tighter leading-[0.9] mb-12 text-primary uppercase">
                MOTION<br/>FRAGMENTS.
            </h1>
            <p class="text-xl lg:text-2xl text-secondary leading-relaxed max-w-2xl font-light">
                Moving image archives. Narrative experiments and process documentation captured through a minimalist lens.
            </p>
        </header>

        <!-- Video Grid: 2 cols desktop, 1 col mobile -->
        <div id="videography-grid-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12">
            <!-- Content will be injected here -->
        </div>

        <script>
            // Extract YouTube video ID from any standard YouTube URL
            function getYouTubeId(url) {
                if (!url) return null;
                const patterns = [
                    /youtu\.be\/([^?&]+)/,
                    /youtube\.com\/watch\?v=([^?&]+)/,
                    /youtube\.com\/embed\/([^?&]+)/,
                    /youtube\.com\/shorts\/([^?&]+)/
                ];
                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            }

            async function loadVideography() {
                const container = document.getElementById('videography-grid-container');
                try {
                    const response = await fetch('../data/content.json');
                    const data = await response.json();

                    if (data.videography && data.videography.length > 0) {
                        container.innerHTML = data.videography.map((item, index) => {
                            const videoId = getYouTubeId(item.url);
                            const embedUrl = videoId
                                ? `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`
                                : null;

                            const plateNo = `V-${(index + 1).toString().padStart(3, '0')}`;

                            if (embedUrl) {
                                return `
                                    <div class="group flex flex-col gap-4">
                                        <div class="aspect-video w-full overflow-hidden bg-surface-container">
                                            <iframe
                                                src="${embedUrl}"
                                                title="${item.title}"
                                                class="w-full h-full"
                                                frameborder="0"
                                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                allowfullscreen
                                                loading="lazy"
                                            ></iframe>
                                        </div>
                                        <div class="flex flex-col gap-1">
                                            <span class="text-[0.55rem] font-bold tracking-[0.2em] uppercase opacity-30">PLATE NO. ${plateNo}</span>
                                            <h3 class="text-sm font-semibold tracking-tight">${item.title}</h3>
                                            ${item.description ? `<p class="text-xs text-secondary opacity-60 leading-relaxed mt-0.5">${item.description}</p>` : ''}
                                            ${item.year ? `<span class="text-[0.55rem] font-medium tracking-widest uppercase opacity-30 mt-1">${item.year}${item.duration ? ' · ' + item.duration : ''}</span>` : ''}
                                        </div>
                                    </div>
                                `;
                            } else {
                                // Fallback if URL isn't a recognisable YouTube link
                                return `
                                    <div class="group flex flex-col gap-4">
                                        <div class="aspect-video w-full overflow-hidden bg-surface-container flex items-center justify-center opacity-40">
                                            <span class="text-xs uppercase tracking-widest">Invalid URL</span>
                                        </div>
                                        <div class="flex flex-col gap-1">
                                            <span class="text-[0.55rem] font-bold tracking-[0.2em] uppercase opacity-30">PLATE NO. ${plateNo}</span>
                                            <h3 class="text-sm font-semibold tracking-tight">${item.title}</h3>
                                        </div>
                                    </div>
                                `;
                            }
                        }).join('');
                    } else {
                        container.innerHTML = '<p class="col-span-2 py-8 text-secondary opacity-40">No video entries found.</p>';
                    }
                } catch (error) {
                    console.error('Error loading videography records:', error);
                    container.innerHTML = '<p class="col-span-2 py-8 text-error">Error loading records.</p>';
                }
            }

            loadVideography();
        </script>
    </main>

    <!-- Sticky/Fixed Elements using Size Variant 1 -->
    <footer class="fixed bottom-12 right-12 pointer-events-none opacity-20">
        <div class="text-[0.625rem] font-medium tracking-[0.3em] uppercase rotate-90 origin-right">

        </div>
    </footer>
</body>
</html>
