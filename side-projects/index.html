<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#3b3b3b",
                        "tertiary-fixed-dim": "#474747",
                        "surface-dim": "#dadad5",
                        "on-error-container": "#410002",
                        "on-background": "#1a1c19",
                        "primary-fixed": "#5e5e5e",
                        "surface-variant": "#e3e3de",
                        "on-tertiary-fixed-variant": "#e2e2e2",
                        "on-tertiary-fixed": "#ffffff",
                        "primary": "#000000",
                        "background": "#fafaf5",
                        "surface-tint": "#5e5e5e",
                        "tertiary-container": "#747474",
                        "on-tertiary-container": "#ffffff",
                        "surface-bright": "#fafaf5",
                        "on-tertiary": "#e2e2e2",
                        "inverse-surface": "#2f312e",
                        "surface-container-high": "#e8e8e3",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "on-surface": "#1a1c19",
                        "primary-container": "#3b3b3b",
                        "on-secondary-fixed": "#1b1b1b",
                        "tertiary-fixed": "#5e5e5e",
                        "surface-container": "#eeeee9",
                        "secondary-container": "#d4d4d4",
                        "on-secondary": "#ffffff",
                        "tertiary": "#3b3b3b",
                        "surface": "#fafaf5",
                        "outline": "#777777",
                        "inverse-primary": "#c6c6c6",
                        "on-primary-container": "#ffffff",
                        "primary-fixed-dim": "#474747",
                        "secondary": "#5e5e5e",
                        "on-primary": "#e2e2e2",
                        "on-surface-variant": "#474747",
                        "surface-container-highest": "#e3e3de",
                        "outline-variant": "#c6c6c6",
                        "secondary-fixed-dim": "#ababab",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f1f1ec",
                        "on-primary-fixed": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#1b1b1b",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#c6c6c6",
                        "surface-container-low": "#f4f4ef",
                        "on-error": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Space Grotesk", "sans-serif"],
                        "label": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px" },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>side projects // eric alex</title>
</head>

<body class="font-body text-on-surface selection:bg-primary selection:text-on-primary">
    <nav class="fixed top-8 left-8 lg:top-12 lg:left-12 z-50">
        <a class="flex items-center gap-2 text-on-surface text-style-label transition-all duration-300 hover:text-secondary bg-surface/60 backdrop-blur-md px-4 py-2 rounded-full border border-outline-variant/10 shadow-sm hover:shadow-md hover:-translate-y-0.5"
            href="../">
            <span class="material-symbols-outlined !text-[1.2rem]" data-icon="arrow_back">arrow_back</span>
            <span class="tracking-widest uppercase text-[0.65rem] font-bold">Back</span>
        </a>
    </nav>
    <main class="max-w-7xl mx-auto px-8 pt-24 lg:pt-32 pb-8 lg:pb-12 min-h-[716px]">
        <!-- Opening Statement -->
        <div class="mb-16 lg:mb-24">
            <h1 class="text-4xl md:text-6xl text-style-title tracking-tighter leading-[0.9] text-primary lowercase mb-8">
                side projects
            </h1>
            <div class="h-[1px] w-full bg-primary opacity-100"></div>
        </div>

        <!-- Experience List Table -->
        <div class="w-full bg-[#f7f7f2] border border-primary/5 p-6 md:p-12">
            <!-- Header -->
            <div class="hidden md:grid grid-cols-[1fr_2fr_1fr] border-b border-primary/10 pb-6 mb-2">
                <span class="text-[0.65rem] font-bold tracking-widest text-primary opacity-30 uppercase">Year</span>
                <span class="text-[0.65rem] font-bold tracking-widest text-primary opacity-30 uppercase">Project & Category</span>
                <span class="text-[0.65rem] font-bold tracking-widest text-primary opacity-30 uppercase text-right">Action</span>
            </div>

            <section id="projects-list-container" class="divide-y divide-primary/5">
                <!-- Content will be injected here -->
            </section>
        </div>

        <script>
            async function loadProjects() {
                const container = document.getElementById('projects-list-container');
                try {
                    const response = await fetch('../data/content.json');
                    const data = await response.json();

                    if (data.sideProjects && data.sideProjects.length > 0) {
                        const html = data.sideProjects.map((item, index) => {
                            return `
                                <a href="detail?id=${item.id}" class="group grid grid-cols-1 md:grid-cols-[1fr_2fr_1fr] items-center py-6 hover:bg-primary/[0.02] transition-all duration-300">
                                    <div class="mb-2 md:mb-0">
                                        <span class="text-sm tabular-nums text-primary opacity-40 group-hover:opacity-100 transition-opacity duration-300">${item.year}</span>
                                    </div>
                                    <div class="flex flex-col">
                                        <h2 class="text-base font-medium tracking-tight text-primary group-hover:text-secondary transition-colors duration-300">${item.title}</h2>
                                        <p class="text-xs text-secondary opacity-60 font-medium uppercase tracking-widest">${item.category}</p>
                                    </div>
                                    <div class="hidden md:flex justify-end items-center">
                                        <span class="text-[0.65rem] font-bold tracking-widest text-primary opacity-0 group-hover:opacity-30 transition-opacity duration-300 uppercase">View Details</span>
                                    </div>
                                </a>
                            `;
                        }).join('');

                        container.innerHTML = html;
                    }
                } catch (error) { console.error(error); }
            }
            loadProjects();
        </script>
    </main>
</body>

</html>
