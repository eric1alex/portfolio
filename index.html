<body class="bg-background font-body overflow-hidden">
    <div
        class="fixed bottom-0 left-0 w-full bg-black text-white text-[0.6rem] uppercase tracking-[0.3em] font-bold py-2 text-center z-[100]">
        site in progress

    <main
        class="h-[100dvh] w-full flex items-center justify-center p-6 pb-16 lg:p-12 animate-in fade-in duration-1000 overflow-hidden">
        <div
            class="max-w-7xl w-full max-h-full grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-32 items-center overflow-hidden">
            <!-- Left Side: Large Clean Image Container (Slideshow) -->
            <div class="relative group order-2 lg:order-1 max-w-xl mx-auto lg:mx-0">
                <div class="aspect-[4/5] w-full bg-surface-container overflow-hidden relative" id="slideshow-container">
                    <!-- Images will be injected here via JS for smooth control -->
                </div>
                <!-- Metadata: Size Variant 1 (Label style) -->
                <div
                    class="mt-6 flex justify-between items-baseline opacity-30 text-[0.625rem] font-medium tracking-[0.2em] uppercase">
                    <span id="slide-plate-no">PLATE NO. 042 / ARCHIVAL</span>
                    <span id="slide-year">EST. MMXXIV</span>
                </div>
            </div>

            <script>
                const slides = [
                    { url: '/images/Image - 3.jpg', plate: 'PLATE NO. 042 / STILL ALIVE', year: 'EST. MMXXIV' },
                    { url: '/images/Image - 1.jpg', plate: 'PLATE NO. 018 / HIGH', year: 'EST. MMXXIV' },
                    { url: '/images/Image - 5.jpg', plate: 'PLATE NO. 089 / LOOKOUT', year: 'EST. MMXXIV' },
                    { url: '/images/Image - 7.jpg', plate: 'PLATE NO. 112 / SO CLOSE', year: 'EST. MMXXIV' }
                ];

                let currentSlide = 0;
                const container = document.getElementById('slideshow-container');
                const plateEl = document.getElementById('slide-plate-no');
                const yearEl = document.getElementById('slide-year');

                function initSlideshow() {
                    // Create image elements
                    slides.forEach((slide, i) => {
                        const img = document.createElement('img');
                        img.src = slide.url;
                        img.alt = slide.plate;
                        img.className = `absolute inset-0 w-full h-full object-cover grayscale brightness-110 contrast-110 transition-all duration-1000 ease-in-out opacity-0 group-hover:scale-105`;
                        if (i === 0) img.classList.add('opacity-100');
                        container.appendChild(img);
                    });

                    setInterval(nextSlide, 6000);
                }

                function nextSlide() {
                    const images = container.querySelectorAll('img');
                    images[currentSlide].classList.remove('opacity-100');
                    images[currentSlide].classList.add('opacity-0');

                    currentSlide = (currentSlide + 1) % slides.length;

                    images[currentSlide].classList.remove('opacity-0');
                    images[currentSlide].classList.add('opacity-100');

                    // Update Metadata with a slight delay for better rhythm
                    setTimeout(() => {
                        plateEl.textContent = slides[currentSlide].plate;
                        yearEl.textContent = slides[currentSlide].year;
                    }, 500);
                }

                initSlideshow();
            </script>
