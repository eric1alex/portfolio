<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin — Sign In</title>
    <meta name="robots" content="noindex, nofollow"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f5f4f0;
            --surface: #ffffff;
            --on-surface: #1a1c19;
            --secondary: #4a4f47;
            --outline: #c4c8be;
            --primary: #1a1c19;
            --error: #ba1a1a;
            --accent: #3d6b4f;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--on-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
        .logo {
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--secondary);
            opacity: 0.5;
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.8125rem;
            color: var(--secondary);
            margin-bottom: 3rem;
            opacity: 0.7;
        }
        .field {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            opacity: 0.6;
        }
        input[type="password"] {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 2px;
            padding: 0.875rem 1rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9375rem;
            color: var(--on-surface);
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: var(--primary);
        }
        .btn-login {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 2px;
            padding: 0.875rem 1rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.8; }
        .btn-login:disabled { opacity: 0.4; cursor: not-allowed; }
        .error-msg {
            font-size: 0.75rem;
            color: var(--error);
            margin-top: 0.75rem;
            display: none;
        }
        .error-msg.visible { display: block; }
        .divider {
            border: none;
            border-top: 1px solid var(--outline);
            margin: 3rem 0 1.5rem;
            opacity: 0.4;
        }
        .back-link {
            font-size: 0.625rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--secondary);
            text-decoration: none;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="login-card">
        <p class="logo">The Monastic Editorial</p>
        <h1>Admin<br/>Access.</h1>
        <p class="subtitle">This portal is not publicly accessible.</p>

        <div class="field">
            <label for="password">Access Key</label>
            <input type="password" id="password" placeholder="Enter your access key" autocomplete="current-password" autofocus/>
        </div>
        <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign In</button>
        <p class="error-msg" id="errorMsg">Incorrect access key. Try again.</p>

        <hr class="divider"/>
        <a href="../index.html" class="back-link">← Return to site</a>
    </div>

    <script>
        // Check if already logged in
        if (sessionStorage.getItem('admin_auth') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);

        // Show dev mode button only on localhost
        if (isLocalDev) {
            const devBtn = document.getElementById('devModeBtn');
            if (devBtn) devBtn.style.display = 'block';
        }

        async function handleLogin() {
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const password = document.getElementById('password').value.trim();

            if (!password) return;

            // ── Local dev bypass ──
            if (isLocalDev) {
                sessionStorage.setItem('admin_auth', 'true');
                window.location.href = 'dashboard.html';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            errorMsg.classList.remove('visible');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    sessionStorage.setItem('admin_auth', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.classList.add('visible');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (err) {
                errorMsg.textContent = 'API unavailable.';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
